*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:AndikaLocal,Arial,sans-serif;background:#172433;color:#fff}button{font:inherit;cursor:pointer;touch-action:manipulation}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#08182b 0%,#16283a 55%,#24323b 55%,#202b33 100%)}.scene svg{width:100%;height:100%;display:block}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(2,8,18,.60);transition:background .35s}.scene.lit:after{background:rgba(3,9,19,.13)}.scene .lightbeams{opacity:0;transition:opacity .35s}.scene.lit .lightbeams{opacity:1}.scene .glow{opacity:0;transition:opacity .3s}.scene.lit .glow{opacity:1}.scene .person{filter:brightness(.55);transition:filter .35s}.scene.lit .person{filter:brightness(1)}.scene .reflective{opacity:.2;transition:opacity .3s}.scene.lit .reflective{opacity:1;filter:drop-shadow(0 0 7px white)}.car-button{position:absolute;bottom:6%;left:4%;width:32%;height:28%;background:transparent;border:0;z-index:4;cursor:pointer}.car-label{position:absolute;bottom:5px;left:3%;font-size:clamp(11px,1.8vw,18px);background:#ffffffeb;color:#14283c;padding:4px 10px;border-radius:30px;z-index:5;pointer-events:none;font-weight:bold}.wardrobe{background:#f4e8d5;color:#263748;border-top:7px solid #9c7751;padding:7px 10px 10px;box-shadow:0 -4px 14px #0005;flex:0 0 clamp(180px,34dvh,290px);display:flex;flex-direction:column;min-height:0}.wardrobe-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto}.wardrobe h2{margin:0;font-size:clamp(15px,2vw,21px)}.wardrobe p{margin:0;font-size:clamp(11px,1.5vw,15px)}.clothes{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px;flex:1;min-height:0;padding-top:7px}.item{background:#fffdf9;border:2px solid #c8a98b;border-radius:11px;min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab;padding:3px}.item svg{height:100%;max-width:100%;aspect-ratio:1}.item:focus-visible,.car-button:focus-visible{outline:4px solid #ffcc55}.dragghost{position:fixed;pointer-events:none;z-index:999;opacity:.94;width:75px;height:75px;filter:drop-shadow(0 5px 6px #0008)}.drop{cursor:pointer}.drop.target{stroke:#ffdc6e;stroke-width:2;stroke-dasharray:4 3;fill-opacity:.12}.reset{background:#fff;color:#17344a;border:2px solid #ab8b6b;border-radius:9px;padding:4px 10px;font-weight:bold}.note{font-size:12px;color:#4c5c65}.scene .people{transform:translate(0,0)}@media(max-width:650px){.wardrobe{flex-basis:clamp(185px,40dvh,270px)}.clothes{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.wardrobe p{display:none}.car-button{width:40%}.car-label{font-size:11px}.wardrobe h2{font-size:16px}}@media(max-height:460px) and (orientation:landscape){.wardrobe{flex-basis:45dvh}.clothes{grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}}

.scene-tools{position:absolute;right:12px;top:12px;z-index:12;display:flex;gap:8px}
.scene-tools button,.qr-panel button{font:800 clamp(13px,1.6vw,17px) AndikaLocal,Arial,sans-serif!important;color:#19364c!important;-webkit-text-fill-color:#19364c!important;background:#fff!important;border:2px solid #b9d4e5!important;border-radius:11px!important;min-height:42px;padding:7px 12px;cursor:pointer}
.qr-dialog[hidden]{display:none!important}
.qr-dialog{position:fixed;inset:0;z-index:99;background:#071627bc;display:grid;place-items:center;padding:15px}
.qr-panel{background:white;color:#19364c;border-radius:18px;padding:20px;text-align:center;width:min(94vw,350px);box-shadow:0 12px 40px #0006}
.qr-panel h2{margin:0 0 12px}.qr-panel p{font-size:14px}.qr-panel img{background:white;padding:5px;max-width:100%}
@media(max-width:600px){.scene-tools{top:6px;right:6px;gap:5px}.scene-tools button{padding:5px 7px;min-height:35px;font-size:12px!important}}
</style></head><body><div class="app"><div class="scene" id="scene"><svg id="world" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Eine Person an einer Straße bei Nacht. Ein Auto kann mit einem Tippen die Scheinwerfer einschalten."><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0a1729"/><stop offset="1" stop-color="#263b52"/></linearGradient><radialGradient id="beam"><stop stop-color="#fff6ba" stop-opacity=".75"/><stop offset="1" stop-color="#fff6ba" stop-opacity="0"/></radialGradient></defs><rect width="1000" height="600" fill="url(#sky)"/><circle cx="830" cy="83" r="35" fill="#f4e9bb" opacity=".7"/><g fill="#122333"><rect x="20" y="130" width="150" height="260"/><rect x="175" y="185" width="120" height="210"/><rect x="760" y="160" width="200" height="235"/></g><g fill="#d8c785" opacity=".45"><rect x="44" y="167" width="35" height="45"/><rect x="103" y="167" width="35" height="45"/><rect x="197" y="220" width="34" height="45"/><rect x="793" y="203" width="35" height="44"/><rect x="874" y="203" width="35" height="44"/></g><path d="M0 385H1000V600H0Z" fill="#343b43"/><path d="M0 420H1000" stroke="#6b7883" stroke-width="12"/><path d="M0 535H1000" stroke="#f5f1d2" stroke-width="9" stroke-dasharray="90 70"/><g class="lightbeams"><path d="M377 456 Q555 342 810 228 L950 510 Q652 503 377 456Z" fill="#fff1a8" opacity=".16"/><ellipse cx="687" cy="385" rx="285" ry="180" fill="url(#beam)" opacity=".85"/></g><g id="car" transform="translate(40 365)"><ellipse cx="190" cy="140" rx="175" ry="20" fill="#141b23"/><path d="M30 65L65 25Q78 5 112 5H237Q269 5 285 36L313 64Q338 75 342 103V127H15V95Q15 73 30 65Z" fill="#2d82b5" stroke="#0c3453" stroke-width="5"/><path d="M83 30H232Q250 30 262 65H59Z" fill="#9dbbcd"/><path d="M164 30V65" stroke="#2b4d64" stroke-width="5"/><circle cx="82" cy="130" r="29" fill="#1b222b"/><circle cx="276" cy="130" r="29" fill="#1b222b"/><circle cx="82" cy="130" r="14" fill="#a5b5bf"/><circle cx="276" cy="130" r="14" fill="#a5b5bf"/><rect x="318" y="80" width="21" height="25" rx="5" fill="#e4dfbd"/><rect x="17" y="85" width="14" height="23" rx="5" fill="#d25b4b"/><rect class="glow" x="319" y="80" width="23" height="26" rx="5" fill="#fffbd1"/></g><g id="person0" class="person" transform="translate(690 155) scale(1.08)"></g></svg><button class="car-button" id="carButton" aria-label="Autoscheinwerfer ein- oder ausschalten"></button><span class="car-label" id="carLabel">Auto antippen: Licht an</span><div class="scene-tools"><button type="button" id="qrBtn">QR-Code</button><button type="button" id="exitBtn">Beenden</button></div></div><section class="wardrobe"><div class="wardrobe-head"><div><h2>Kleiderschrank</h2><p>Kleidung auf die Person ziehen</p></div><button class="reset" id="reset">Neu anziehen</button></div><div class="clothes" id="clothes"></div></section></div><div id="qrDialog" class="qr-dialog" hidden><div class="qr-panel"><h2>QR-Code zum Spiel</h2><img id="qrPic" alt="QR-Code zum Spiel" width="190" height="190"><p>Der QR-Code funktioniert nach der Veröffentlichung auf der Lernwerkstatt.</p><button id="qrClose">Schließen</button></div></div><script>
const NS='http://www.w3.org/2000/svg';const scene=document.getElementById('scene');let lit=false;document.getElementById('carButton').onclick=()=>{lit=!lit;scene.classList.toggle('lit',lit);document.getElementById('carLabel').textContent=lit?'Auto antippen: Licht aus':'Auto antippen: Licht an'};
const wardrobe=[['shirt','#252c37',false],['shirt','#f3ebcc',false],['shirt','#d84c50',false],['shirt','#f2db3d',false],['shirt','#39a4d7',false],['shirt','#eddd38',true],['pants','#202b36',false],['pants','#e4e7e7',false],['pants','#385da4',false],['pants','#c94e4a',false],['pants','#e5e046',true],['pants','#333333',true],['hat','#2b3441',false],['hat','#e8e9e7',false],['hat','#e8d63a',false],['hat','#f7e539',true],['hat','#c34864',false],['hat','#3a7cb1',false]];
const worn=Array.from({length:1},()=>({shirt:null,pants:null,hat:null}));let selected=null,drag=null;
function shape(kind,color,reflect){let sh='';if(kind==='shirt')sh=`<path d="M-29 0L-48 14L-37 44L-24 38V92H24V38L37 44L48 14L29 0L13 -8H-13Z" fill="${color}" stroke="#29323a" stroke-width="2"/>${reflect?'<path class="reflective" d="M-26 40H26M-26 54H26M-40 19L-29 23M29 23L40 19" stroke="#faffff" stroke-width="8"/>':''}`;if(kind==='pants')sh=`<path d="M-25 0H25L29 90H4L0 33L-5 90H-30Z" fill="${color}" stroke="#29323a" stroke-width="2"/>${reflect?'<path class="reflective" d="M-28 72H-5M5 72H28" stroke="#faffff" stroke-width="8"/>':''}`;if(kind==='hat')sh=`<path d="M-27 13Q-26 -24 0 -25Q26 -24 27 13Z" fill="${color}" stroke="#29323a" stroke-width="2"/><path d="M-34 13H34V25H-34Z" fill="${color}" stroke="#29323a" stroke-width="2"/>${reflect?'<path class="reflective" d="M-28 17H28" stroke="white" stroke-width="7"/>':''}`;return sh}
function renderPerson(i){const el=document.getElementById('person'+i),female=i===1,shirt=worn[i].shirt||['shirt',female?'#a3517a':'#44556b',false],pants=worn[i].pants||['pants','#303b49',false],hat=worn[i].hat;el.innerHTML=`<ellipse cx="0" cy="353" rx="61" ry="11" fill="#101a25" opacity=".5"/><path d="M-27 207L-25 337H-6L0 251L6 337H25L27 207Z" fill="#29313a"/><path d="M-24 335H-2V348H-38Z M4 335H27L39 348H4Z" fill="#1c242b"/><path d="M-29 89L-45 199M29 89L45 199" stroke="${female?'#d8a684':'#ba886c'}" stroke-width="18" stroke-linecap="round"/><path d="M-35 80H35L29 213H-29Z" fill="#374759"/><path d="M-28 205H28V237H-28Z" fill="#2a333b"/><ellipse cx="0" cy="34" rx="35" ry="44" fill="${female?'#d8a684':'#ba886c'}"/><path d="M-34 26Q-45 -30 0 -22Q43 -30 35 26L26 0Q5 -10 -25 2Z" fill="${female?'#4e3029':'#302820'}"/><circle cx="-12" cy="33" r="2.5" fill="#25252a"/><circle cx="12" cy="33" r="2.5" fill="#25252a"/><path d="M-7 51Q0 57 7 51" fill="none" stroke="#874e48" stroke-width="2"/><g transform="translate(0 99) scale(.83 1.20)">${shape(...shirt)}</g><g transform="translate(0 217) scale(.93 1.35)">${shape(...pants)}</g>${hat?`<g transform="translate(0 -4) scale(.9)">${shape(...hat)}</g>`:''}<rect class="drop" data-person="${i}" x="-58" y="-30" width="116" height="380" fill="transparent" stroke="none"/>`}
renderPerson(0);
function iconSVG(item){const [kind,color,refl]=item;const view=kind==='shirt'?'-52 -15 104 112':kind==='pants'?'-36 -6 72 105':'-38 -34 76 66';return `<svg viewBox="${view}" aria-hidden="true">${shape(kind,color,refl)}</svg>`}
const rack=document.getElementById('clothes');wardrobe.forEach((item,i)=>{const b=document.createElement('button');b.className='item';b.type='button';b.innerHTML=iconSVG(item);b.setAttribute('aria-label',({shirt:'Oberteil',pants:'Hose',hat:'Mütze'})[item[0]]+(item[2]?' mit Reflektoren':''));b.dataset.index=i;b.addEventListener('click',()=>{if(!b.dataset.wasdrag){selected=i;b.style.outline='3px solid #e7a33d';setTimeout(()=>b.style.outline='',500)}b.dataset.wasdrag=''});b.addEventListener('pointerdown',e=>{drag={id:i,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,ghost:null};b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!drag||drag.id!==i||drag.pointer!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>8){drag.moved=true;const ghost=document.createElement('div');ghost.className='dragghost';ghost.innerHTML=iconSVG(item);document.body.append(ghost);drag.ghost=ghost}if(drag.moved){drag.ghost.style.left=(e.clientX-38)+'px';drag.ghost.style.top=(e.clientY-38)+'px';e.preventDefault()}});b.addEventListener('pointerup',e=>{if(!drag||drag.id!==i||drag.pointer!==e.pointerId)return;const moved=drag.moved;drag.ghost?.remove();drag=null;if(!moved)return;b.dataset.wasdrag='yes';const target=document.elementFromPoint(e.clientX,e.clientY);const person=target?.closest('[data-person]');if(person)wear(i,Number(person.dataset.person));e.preventDefault()});b.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag=null});rack.append(b)});
function wear(index,person){const item=wardrobe[index];worn[person][item[0]]=item;renderPerson(person)}document.getElementById('world').addEventListener('click',e=>{const target=e.target.closest('[data-person]');if(target&&selected!==null){wear(selected,Number(target.dataset.person));selected=null}});document.getElementById('reset').onclick=()=>{for(let i=0;i<1;i++){worn[i]={shirt:null,pants:null,hat:null};renderPerson(i)}};

const qrTarget='https://annaslernwerkstatt.github.io/sachunterricht/verkehrserziehung.html?spiel=sichtbar';
document.getElementById('qrBtn').addEventListener('click',()=>{
 document.getElementById('qrPic').src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=12&data='+encodeURIComponent(qrTarget);
 document.getElementById('qrDialog').hidden=false;
});
document.getElementById('qrClose').addEventListener('click',()=>document.getElementById('qrDialog').hidden=true);
document.getElementById('exitBtn').addEventListener('click',()=>{
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
 if(history.length>1){history.back()}else{location.href='https://annaslernwerkstatt.github.io/'}
});
</script></body></html>
