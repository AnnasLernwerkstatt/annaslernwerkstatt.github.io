const menu=document.getElementById('menu'),frame=document.getElementById('frame'),back=document.getElementById('back');function openGame(file){frame.src=file;frame.hidden=false;menu.hidden=true;back.hidden=false;history.replaceState(null,'','#'+file)}function home(){frame.hidden=true;frame.src='about:blank';menu.hidden=false;back.hidden=true;history.replaceState(null,'',location.pathname+location.search)}
document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>openGame(b.dataset.src));back.onclick=home;document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>{})};const hash=decodeURIComponent(location.hash.slice(1));if([...document.querySelectorAll('[data-src]')].some(x=>x.dataset.src===hash))openGame(hash);
